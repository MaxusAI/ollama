name: latest
# MaxusAI fork note -- NOT upstream. This workflow's build/publish jobs use
# `runs-on: linux` / `runs-on: windows`, which are SELF-HOSTED labels. This fork
# has no runners registered (/actions/runners is empty at repo level and returns 0
# at org level), so those jobs will QUEUE, never start, and be cancelled or time
# out after 24h. A release attempted today produces nothing.
#
# They are NOT skipped on `vars.SELF_HOSTED_RUNNERS` the way the pull-request
# workflows are (test.yaml, test-llamacpp-update.yaml). Those jobs only report, so
# skipping loses nothing; these PRODUCE AND PUBLISH ARTIFACTS, and a silent skip
# would let a release report success while shipping nothing — worse than a hang.
#
# Instead they FAIL FAST: the first step below errors out in seconds when the
# variable is unset, so an attempted release stops immediately with a readable
# reason rather than queueing for 24h or quietly publishing an empty release.
#
# To release from this fork: register runners, then set the repository variable
# `SELF_HOSTED_RUNNERS=true`.

on:
  release:
    types: [released]

jobs:
  runner-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require self-hosted runners before updating latest
        if: vars.SELF_HOSTED_RUNNERS != 'true'
        run: |
          echo "::error title=No self-hosted runners::update-latest uses runs-on: linux, a self-hosted label this fork has no runners for. Register runners and set SELF_HOSTED_RUNNERS=true. Failing now rather than queueing for 24h."
          exit 1

  update-latest:
    needs: runner-check
    environment: release
    runs-on: linux
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}
      - name: Tag images as latest
        env:
          PUSH: "1"
        shell: bash
        run: |
          export "VERSION=${GITHUB_REF_NAME#v}"
          ./scripts/tag_latest.sh
