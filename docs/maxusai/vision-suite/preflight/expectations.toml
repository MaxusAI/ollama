# ------------------------------------------------------ Apple Silicon / MLX --
# The MLX store carries five standard-lineage gemma4 quants plus the unified
# 12b (inventory verified 2026-08-08 from the store manifests/config blobs).
# One `model` per arch block is the schema; the bf16 export anchors the
# baseline and the quant sweep gets blocks as each variant is measured.

[expect.apple-silicon-mlx.gemma4]
status = "measured"
measured_on = "2026-08-08"
model = "gemma4:31b-mlx-bf16"    # bf16 anchors the baseline (quantisation and
                                 # runner regressions must not be conflated)
patch_stride = 48                # patch_size 16 * n_merge 3
budget_min_tokens = 70           # ADR 0008 floor
budget_max_tokens = 1120         # vendor maximum
image_min_pixels = 161280        # 70 * 48^2
image_max_pixels = 2580480       # 1120 * 48^2

# MLX sizing goes through llm.BudgetFillSize — the same budget-fill semantics
# 004 gives llama.cpp. Measured 2026-08-08 (probes.Ollama.image_prefix, B8
# prefix trick; server 0.32.5-maxusai-0982ab8a, :11436): flat 1102 at all five
# ladder geometries. prefix == text_only == 19 on this arch (no image-request
# tokenisation offset), and 1102 = 44x25 grid + 2 — the +2 marker allowance IS
# the MLX runner's convention too, previously unverified.
#
# Per-quant variants measured identically the same day, same method, same flat
# 1102 ladder and prefix 19: 26b-mlx-bf16, 26b-mxfp8, 31b-mxfp8, 31b-nvfp4,
# 26b-nvfp4. One block keyed on the bf16 anchor covers the lineage; a variant
# drifting from it is a runner regression, not a quant property.
scaling = "flat"
ladder_tolerance = 2
ladder = [1102, 1102, 1102, 1102, 1102]

[expect.apple-silicon-mlx.gemma4_unified]
status = "measured"
measured_on = "2026-08-08"
model = "gemma4:12b-nvfp4"
patch_stride = 48                # unified: patch_size folded to 48, n_merge 1
budget_min_tokens = 70
budget_max_tokens = 1120
image_min_pixels = 161280
image_max_pixels = 2580480

# The open question in the unmeasured row — budget-fill to ~1102, flat at ~280
# soft tokens, or something else — is answered by measurement: the unified
# early-fusion arch budget-fills exactly like the standard lineage. Flat 1102
# at all five geometries, prefix == text_only == 19, +2 marker allowance
# verified (2026-08-08, server 0.32.5-maxusai-0982ab8a, :11436).
scaling = "flat"
ladder_tolerance = 2
ladder = [1102, 1102, 1102, 1102, 1102]

[expect.apple-silicon-mlx.qwen35moe]
status = "measured"
measured_on = "2026-08-12"
model = "qwen3.6:35b-a3b-nvfp4"   # the MLX export anchors this arch; the sibling
                                  # q4_K_M tag is a GGUF and routes to
                                  # llama-server, so it CANNOT anchor an MLX row
patch_stride = 32                 # patch_size 16 * spatial_merge_size 2
budget_min_tokens = 64            # shortest_edge 65536 / 32^2
budget_max_tokens = 16384         # longest_edge 16777216 / 32^2
image_min_pixels = 65536          # qwen35moe.vision.shortest_edge
image_max_pixels = 16777216       # qwen35moe.vision.longest_edge

# Unlike gemma4, this arch does NOT budget-fill: MLX runs plain qwen smart-resize,
# so cost tracks resolution and the ladder must be dynamic. Every geometry
# reproduces from the arithmetic rather than being recorded blind — align each
# edge to 32, clamp total pixels into [min, max], take (w/32)*(h/32), add the
# 2-marker allowance: 6x11+2=68, 16x9+2=146, 32x18+2=578, 64x36+2=2306,
# 96x54+2=5186. 256x144 is the clamp case (32768px is under the 65536 floor, so
# it scales UP to 66 grid tokens). prefix == text_only == 13 on this arch.
# Measured with probes.Ollama.image_prefix (B8 prefix trick) against server
# 0.32.5-maxusai-e6d42b2e on :11436.
#
# Cross-stack note, and the reason the anchor is pinned to the MLX tag. The same
# weights as GGUF (qwen3.6:35b-a3b-q4_K_M, llama-server on the same host) give a
# DIFFERENT ladder: [1034, 1034, 1034, 2306, 4082]. That is not a defect in
# either stack, it is two different default budgets for one model. llama_server
# launches qwen-VL with --image-min-tokens 1024 and caps at 4096 (1034 = 1032+2
# at the floor; 4082 = 85x48+2 after scaling 3072x1728 down under a 4096-token
# ceiling), while MLX honours the model's own 64..16384 range. The two agree
# exactly at 2048x1152 (2306) because that geometry falls inside both windows.
# See ADR 0003/0007/0008 for the budget policy this divergence sits under.
scaling = "dynamic"
ladder_tolerance = 2
ladder = [68, 146, 578, 2306, 5186]


[expect.apple-silicon-mlx.qwen35]
status = "measured"
measured_on = "2026-08-16"
model = "qwen3.8:27b-nvfp4"       # the MLX export; the sibling q4_K_M tag is a
                                  # GGUF and routes to llama-server, so it
                                  # CANNOT anchor an MLX row
patch_stride = 32                 # patch_size 16 * spatial_merge_size 2
budget_min_tokens = 64            # shortest_edge 65536 / 32^2
budget_max_tokens = 16384         # longest_edge 16777216 / 32^2
image_min_pixels = 65536          # preprocessor_config shortest_edge
image_max_pixels = 16777216       # preprocessor_config longest_edge

# Qwen3.8 is the DENSE member of the qwen3_5 architecture: config.json declares
# architectures ["Qwen3_5ForConditionalGeneration"] with a text_config carrying
# 64 layers and no expert keys, where qwen3.6:35b-a3b is the MoE sibling that
# anchors [expect.apple-silicon-mlx.qwen35moe]. llama.cpp draws the same line
# (LLM_ARCH_QWEN35 vs LLM_ARCH_QWEN35MOE), so this is a separate arch row rather
# than a second model on the MoE one. It has to be: run_arch probes exactly the
# model its row names, so hanging qwen3.8 off the MoE row would silently
# re-point qwen3.6's measured baseline.
#
# Same dynamic smart-resize as the MoE sibling, and the ladder reproduces from
# the arithmetic: align each edge to 32, clamp total pixels into [65536,
# 16777216], take (w/32)*(h/32), add the 2-marker allowance — 6x11+2=68,
# 16x9+2=146, 32x18+2=578, 64x36+2=2306, 96x54+2=5186. 256x144 is the clamp case
# (32768px is under the 65536 floor, so it scales UP to 66 grid tokens).
# prefix == text_only == 13.
#
# These are the same five numbers as the qwen35moe row. They were MEASURED here,
# not carried across: the two models share patch_size 16, spatial_merge_size 2
# and the same 65536..16777216 pixel window, so identical geometry is the
# expected result, and agreement is evidence the sizing is shared rather than
# licence to copy a row. Method was validated first by re-measuring
# qwen3.6:35b-a3b-nvfp4 on this same server and reproducing its recorded prefix
# and all five rungs exactly.
#
# Measured with probes.Ollama.image_prefix (B8 prefix trick) against server
# 0.32.5-maxusai-c8f26b1b on :11436, native macOS MLX store.
scaling = "dynamic"
ladder_tolerance = 2
ladder = [68, 146, 578, 2306, 5186]


# ------------------------------------------- APPLE SILICON / NATIVE METAL GGUF --

[expect.apple-silicon-metal.gemma4]
status = "measured"
measured_on = "2026-08-12"
model = "gemma4:31b-it-q4_K_M"    # GGUF tag; routes to llama-server on Metal
