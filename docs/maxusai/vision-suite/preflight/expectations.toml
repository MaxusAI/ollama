image_min_pixels = 161280         # 70 * 48^2
image_max_pixels = 2580480        # 1120 * 48^2

# Exact parity with the MLX profile: flat 1102 at all five geometries, prefix ==
# text_only == 19. 004's budget-fill on llama.cpp and llm.BudgetFillSize on MLX
# are not merely similar, they agree value for value on the same host — which is
# the strongest evidence available that ADR 0008's sizing is genuinely shared
# rather than reimplemented per stack. Measured 2026-08-12 on
# 0.32.5-maxusai-e6d42b2e, :11436; gemma4:12b-it-q4_K_M measured identically the
# same day (same flat 1102, same prefix 19), so this block covers the lineage and
# a variant drifting from it is a payload regression.
scaling = "flat"
ladder_tolerance = 2
ladder = [1102, 1102, 1102, 1102, 1102]

[expect.apple-silicon-metal.qwen35moe]
status = "measured"
measured_on = "2026-08-12"
model = "qwen3.6:35b-a3b-q4_K_M"  # GGUF sibling of the MLX nvfp4 tag
patch_stride = 32                 # patch_size 16 * spatial_merge_size 2
budget_min_tokens = 1024          # llama_server's qwen-VL --image-min-tokens
budget_max_tokens = 4096          # llama_server's qwen-VL ceiling
image_min_pixels = 1048576        # 1024 * 32^2
image_max_pixels = 4194304        # 4096 * 32^2

# This is where the two stacks diverge, and it is a budget-policy difference
# rather than a defect in either. llm/llama_server.go launches qwen-VL with
# --image-min-tokens 1024 and caps at 4096, so the first three geometries are
# pinned to the floor (1032 grid tokens + 2 = 1034; alignment lands just above
# the 1024 request) and the largest is scaled down under the ceiling
# (85x48 + 2 = 4082). MLX honours the model's own 64..16384 range instead and
# runs plain smart-resize, giving [68, 146, 578, 2306, 5186]. The two agree
# EXACTLY at 2048x1152 (2306) because that geometry falls inside both windows —
# which is why a single-geometry check would have missed the divergence
# entirely. See ADR 0003/0007/0008 for the policy this sits under.
#
# Flat at the bottom, scaling above it, so the shape is dynamic: is_flat is
# len(set(ladder)) == 1 and this ladder holds three distinct values.
scaling = "dynamic"
ladder_tolerance = 2
ladder = [1034, 1034, 1034, 2306, 4082]



