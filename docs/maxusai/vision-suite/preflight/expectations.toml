load_hparams pixel lines (that is a llama.cpp-path log line), so measure_ladder
leaves those four fields as TODO here — mlx-metal-0-33-0 filled them by operator
-asserted stride arithmetic. This profile carries them on source identity
instead, checked against the code that actually computes each family's bounds:

  gemma4/gemma4_unified  llm/llama_server.go gemma4Ladder {70,140,280,560,1120}
                         + BudgetFillSize, reached via x/models/gemma4/vision.go
  qwen35/qwen35moe       x/models/qwen3_5/process_image.go visionMinPixels 65536
                         / visionMaxPixels 16777216, via smartResizeBounded

`git diff 21cfe88e..2b95b4a5` is empty for all of llm/llama_server.go's sizing
model (its only hunk is applyCompletionFormat, the ADR 0033 grammar
passthrough), x/models/qwen3_5/process_image.go, x/models/gemma4/vision.go,
x/models/gemma4/media.go and x/models/base/media.go, and `go test ./llm/ -run
TestImageTokensForSize` passes on this build. An earlier draft of this note
cited only llm/llama_server.go, which does not govern the qwen bounds at all —
right conclusion, wrong evidence for half the profile.

WHAT THE LADDER DOES AND DOES NOT DEMONSTRATE. gemma4's flat 1102 pins the
effective rung to the 1120 ceiling (the next rung down, 560, would yield ~552);
1102 itself is 1100 grid + marker_allowance 2, and 1100 is 20 short of 1120
because 16:9 under 48-alignment tops out at 44x25. The 19 is a TEXT prefix and
is not part of the image budget — an earlier draft of this note claimed
"1102 + 19 fills to the 1120 ceiling", which is false in both directions.
budget_min_tokens/image_min_pixels are NOT exercised by these geometries on
gemma4 at all; qwen35's 68 rung is the one that does touch a floor
(256x144 -> 352x192 = 67584 px, scaled up into visionMinPixels).

THE think_format PROBE NOW SENDS A SCHEMA, not bare format:"json" (ADR 0033's
grammar engine was otherwise gated by json.loads() succeeding, which cannot see
a well-formed object of the wrong shape). The per-arch eval_count comments on
those blocks were measured BEFORE that change; re-measured against this build on
2026-08-30 with the schema applied, gemma4_unified 582 and qwen35 290, both
still far under the 4000 budget. The schema deliberately describes the shape the
existing prompt already asks for: changing the task instead sent gemma4:12b into
runaway thinking (4000 tokens, empty response), i.e. the probe failed a healthy
build.

Vision golden parity re-checked at MLX c793734e and NOT recalibrated —
TestVisionGoldenParity passes for 12b, 26b and 31b (31b norm_mean 96.941 ->
96.749, inside bounds). The 0.33.0 note stands: the bf16 control measures
<=0.06 per element while fused-nvfp4 drift reaches <=0.19, so quantisation and
runner regressions must not be conflated.
"""

