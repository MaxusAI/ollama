# Pre-deploy regression expectations.
#
# THIS FILE IS THE CONTRACT. The harness asserts nothing that is not written here.
# Expectations are keyed by (profile, arch), where a profile is a
# (platform, payload patch set) pair. They are versioned alongside the payload
# they describe, because a compat patch legitimately changes them — 004 made
# gemma4 flat, 005 moved nemotron's pinned cost 3390 -> 3270.
#
# TO ADD OR CHANGE AN EXPECTATION WHEN A COMPAT PATCH LANDS, see README.md
# ("Adding an expectation"). Do not edit measured numbers to make a run go green
# without a recorded measurement behind them.

schema_version = 1

# Enforced floor on num_predict for any generative probe. Below ~600 the thinking
# parsers in gemma4 / nemotron3 / qwen3.6 consume the whole allowance inside an
# unclosed thinking block and return response:"" with eval_count == num_predict,
# which reads as a vision failure but is a harness bug. Measured 2026-08-07 at
# num_predict=120 on three probes.
min_num_predict = 600

# prompt_eval_count includes the image begin/end marker tokens, which a pure grid
# calculation does not. Every ladder/pinned number below is grid + this.
marker_allowance = 2

# The ladder is the same five 16:9 geometries for every arch, so a flat row and a
# scaling row are directly comparable. 16:9 is deliberate: gemma4's budget-fill
# lands on 44x25 at this aspect, which is why its row is flat at 1102.
ladder_sizes = ["256x144", "512x288", "1024x576", "2048x1152", "3072x1728"]


# =============================================================================
# PROFILES — (platform, payload patch set). Resolved from --platform plus the
# server's reported version string. An unmatched combination is a hard error.
# =============================================================================

[profiles.cuda-dynres-005]
platform = "cuda"
# Asserted BEFORE any measurement is trusted. 11434/11435/11436 are all occupied
# on 10.8.0.6 and a canary once answered from the wrong server; only a version
# mismatch caught it.
version_pattern = '^0\.32\.\d+-dynres-[0-9a-f]{7,40}$'
patchset = ["001", "002", "004", "005"]
# The payload's real identity, read from `llama-server --version` on the running
# container. The version string cannot carry this: two builds three upstream
# releases apart both reported `0.32.5-dynres-*` while the payload moved
# b10091 -> b10353, so expectations measured on the first were silently applied
# to the second. It passed, but by luck — a bump that DID move sizing would have
# surfaced as an unexplained ladder failure rather than a payload change.
# So the version pattern now only asks "is this a fork dynres build", and this
# pin answers "is this the payload the numbers below were measured on".
# b10353 == llama.cpp f8def7fe1; measured 2026-08-12 on :11437.
llama_cpp_build = "f8def7fe1"
reference_image = "maxusai/ollama:7b44e3fa-dynres"
expect_patch_marker = 1          # grep -c -- --image-max-tokens /usr/bin/ollama
arches = ["nemotron_h_omni", "gemma4"]
notes = """
Blackwell / 10.8.0.6. Selects cuda_v13; a full build ships cpu + cuda_v12 +
cuda_v13 + vulkan + mlx_cuda_v13. Reference canary for a passing run, verified
2026-08-08 on :11437.
"""

[profiles.rocm-0-32-1-dynres]
platform = "rocm"
version_pattern = '^0\.32\.1-dynres-[0-9a-f]{7,40}$'
patchset = ["001", "002", "004", "005"]
reference_image = "0.32.1-dynres-35d9e58e"
expect_patch_marker = 1
arches = ["nemotron_h_omni", "gemma4"]
notes = """
gfx1151 (Ryzen AI Max+ 395 / Radeon 8060S), host 10.8.0.4, served from the
`release/0.32.1-dynres` lineage. Deployed 2026-08-08 per
spec/vision-image-token-budgets.md §2.3 on that branch.

WHAT THE AMD GATE ACTUALLY PINS. docs/maxusai/amd-upgrade-gate.md (2026-07-31)
blocks the **ollama 0.32.5 base / b10091 payload**, not the compat patches. The
release lineage stayed on 0.32.1 + b9888 and then took 002, 004 and 005 as
*adapted* backports (`5f6e7fdc`, `593fc3b1`, `35d9e58e`). So this host's patch set
now matches the CUDA profile's while its llama.cpp payload does not — b9888 vs
b10091. That is exactly why the profile is keyed on (platform, version) rather
than on the patch list.

Do not read the gate as "ROCm is a pre-002 payload". It was that at
`0.32.1-gemma4budget-85ebcb79` (001 only, verified by tree inspection), which is
no longer what is deployed.
"""

[profiles.apple-silicon-cpu]
platform = "apple-silicon"
version_pattern = '^0\.32\.5-dynres-[0-9a-f]{7,40}$'
patchset = ["001", "002", "004", "005"]
reference_image = "maxusai/ollama:4987dd49-dynres-arm64"
expect_patch_marker = 1
arches = ["nemotron_h_omni", "gemma4"]
notes = """
CPU-only linux/arm64 image plus a native Metal path; see
docs/maxusai/spec/apple-silicon-build.md. Token costs are payload properties and
should match the CUDA profile — but greedy sampling diverges on backend floating
point, so text-comparing generative output across backends is invalid even at
identical prompt_eval_count. Only the token/quality checks carry over.
"""

[profiles.apple-silicon-mlx]
platform = "apple-silicon-mlx"
# Native macOS serve against the MLX store (OLLAMA_MODELS=~/.ollama/models-mlx,
# conventionally :11436). Same fork Go binary as the CPU profile, but the payload
# under test is the Go MLX runner, not a llama.cpp patchset — (platform, version)
# alone cannot tell the two serving stacks apart, so the operator states the
# stack via --platform. Tighten this pattern to the exact stamp when the first
# baseline is taken; a wider pattern is safe only while every expectation below
# is unmeasured (NEEDS_BASELINE cannot false-pass).
version_pattern = '^0\.32\.5-maxusai-[0-9a-f]{7,40}$'  # tightened at first baseline (2026-08-08)
patchset = []                     # llama.cpp compat patches do not apply to MLX
reference_image = "native macOS build — no container"
# The fork Go binary carries the --image-max-tokens flag either way; without a
# container the binary and log checks are skipped by the harness anyway.
expect_patch_marker = 1
arches = ["gemma4", "gemma4_unified", "qwen35moe", "qwen35"]
notes = """
MLX vision merged to main 2026-08-08 (7380a61f); sizing goes through
llm.BudgetFillSize. Audio input still returns an explicit 400 on MLX, so no
audio probes. Native serve means no container: image_tag, patch-marker and
load-log payload proof are skipped by design — the token ladder and generative
probes are the evidence here.
"""

[profiles.apple-silicon-metal]
platform = "apple-silicon"
version_pattern = '^0\.32\.5-maxusai-[0-9a-f]{7,40}$'
patchset = ["001", "002", "003", "004", "005"]
reference_image = "native macOS build — no container"
expect_patch_marker = 1
arches = ["gemma4", "qwen35moe"]
notes = """
The GGUF half of Apple Silicon: the SAME native macOS binary as
apple-silicon-mlx, serving llama.cpp with Metal. Which stack you get is decided
by the model tag, not by the server — q4_K_M/q8 route to llama-server even when
OLLAMA_MODELS points at the MLX store, while nvfp4/mxfp8/mlx-bf16 take the MLX
runner. That is why this profile and apple-silicon-mlx share a version_pattern
and are separated by --platform.

Deliberately NOT a reuse of apple-silicon-cpu, which describes the CPU-only
linux/arm64 container. Two things differ: that artifact is stamped
0.32.5-dynres-, and it never compiles models/003 (no Metal backend), so its
patchset is a strict subset. It is also expected to be slower — arm64 Linux in a
VM with no Metal passthrough — and is a distribution artifact for other M-family
Macs rather than the reference. The native Metal build is the reference on this
platform.

Token costs are payload properties and are expected to match the MLX profile
wherever both stacks honour the same budget; where they do not, the gemma4 and
qwen35moe blocks below record why. Generative text must NOT be compared across
the two: greedy sampling diverges on backend floating point even at identical
prompt_eval_count.
"""


# =============================================================================
# EXPECTATIONS — [expect.<profile>.<arch>]
# =============================================================================

# ---------------------------------------------------------------- CUDA / 005 --

[expect.cuda-dynres-005.nemotron_h_omni]
status = "measured"
measured_on = "2026-08-07/08"
model = "nemotron3:33b-q8"

# Payload patch proof, read from the MODEL-LOAD LOG, never from the binary.
# N == max_tokens * S^2 where S = patch_size * n_merge = 16 * 2 = 32.
# Static inspection of libmtmd.so is unreliable and must not be used: `strings`
# is absent from the ollama images so in-container greps return misleading
# zeros, and <img>/</img> literals appear in stock too (InternVL uses them).
patch_stride = 32
budget_min_tokens = 256
budget_max_tokens = 3328
image_min_pixels = 262144        # 256 * 32^2
image_max_pixels = 3407872       # 3328 * 32^2

# Per-arch verdict logic. "dynamic" means a flat ladder diagnoses an UNPATCHED
# payload. Do NOT share this heuristic with gemma4, where flat is correct.
scaling = "dynamic"
ladder_tolerance = 2
# Corrected 2026-08-08: was [265, 265, 577, 2305, 3269], one token low on every
# rung. Those values were recorded against a text-only baseline of 21; the text
# prefix inside an image-bearing request is 20 on this arch, so every delta was
# under-reported by exactly 1 (B8, probes.Ollama.image_prefix). Each rung is now
# grid + 2 markers, and the last agrees with the pinned expect_tokens = 3270
# below and with TestImageTokensForSize.
ladder = [266, 266, 578, 2306, 3270]

[expect.cuda-dynres-005.nemotron_h_omni.pinned]
# The 005 defect class: image_min_tokens == image_max_tokens. Pre-005 a pinned
# 3328 delivered 3390 — 60 grid tokens OVER its own ceiling. Post-005: 3270.
#
# The harness read 3269 pinned / 2305 control on the :11437 canary 2026-08-08 —
# one token under each recorded value. That was originally written off as the
# documented +/-2 grid quantisation. It was not: quantisation does not land
# deterministically one low on every rung, across both runner configs. It was
# the harness subtracting the text-only count (21) instead of the in-image text
# prefix (20) — see B8 and probes.Ollama.image_prefix, fixed 2026-08-08. The
# recorded values were right; the measurement was 1 low. Do not widen the
# tolerance to absorb a constant offset — it would mask a real 1-token change.
size = "2048x1152"
pin_tokens = 3328
expect_tokens = 3270
tolerance = 4
# Class invariant, asserted independently of the exact value above so a NEW
# overshoot is caught even at a number nobody has measured yet:
#   delivered - marker_allowance <= budget_max_tokens
enforce_ceiling_invariant = true
# Same image, same run, budget left alone. Must not move.
control_expect_tokens = 2306
control_tolerance = 4

[expect.cuda-dynres-005.nemotron_h_omni.think_format]
# The fork's fix. Stock returns an empty `response` for nemotron3/qwen3.6 when
# think:true is combined with format:"json".
#
# num_predict measured 2026-08-08 on the canary: this probe needs 1,248 tokens
# (4,504 chars of thinking, then 308 chars of valid JSON). At 900 it returned
# response:"" with eval_count exactly 900 — the num_predict trap, correctly
# diagnosed as such by the harness rather than reported as a vision failure.
# 4000 matches the vision-suite guidance for THINK=on and leaves 3x headroom.
num_predict = 4000
require_nonempty_response = true
require_valid_json = true
# Judge `thinking` as well as `response` — an empty response with a populated
# thinking block is the num_predict trap, not a vision failure, and is reported
# as such.
require_nonempty_thinking = true

[expect.cuda-dynres-005.gemma4]
status = "measured"
measured_on = "2026-08-07/08"
model = "gemma4:31b-it-q4_K_M"
patch_stride = 48                # patch_size 16 * n_merge 3, read from the load log
budget_min_tokens = 70           # post-ADR-0008 floor
budget_max_tokens = 1120         # vendor maximum; ladder rungs 70/140/280/560/1120
image_min_pixels = 161280        # 70 * 48^2
image_max_pixels = 2580480       # 1120 * 48^2

# 004 changed gemma4 from size-scaling to budget-fill: every image is scaled to
# the ceiling, so at 16:9 the grid is 44x25 = 1100 at EVERY resolution. A flat
# ladder here is the CORRECT result and must not be reported as unpatched.
scaling = "flat"
ladder_tolerance = 2
ladder = [1102, 1102, 1102, 1102, 1102]

[expect.cuda-dynres-005.gemma4.think_format]
num_predict = 4000
require_nonempty_response = true
require_valid_json = true
require_nonempty_thinking = false   # gemma4 handles think+format on stock too

# gemma4 has no pinned-budget expectation recorded: the 005 defect was found on
# nemotron and the equivalent gemma4 probe has not been measured. Omitting the
# section is how you say "not measured" — the harness reports it as skipped with
# a reason rather than inventing a number.


